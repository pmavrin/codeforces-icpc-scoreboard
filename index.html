<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08111f">
  <title>ICPC Live Scoreboard</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #070d18;
      --surface: #0d1727;
      --surface-raised: #121f33;
      --line: rgba(184, 206, 235, .14);
      --muted: #8fa1b9;
      --text: #f4f7fb;
      --blue: #5da9ff;
      --blue-soft: rgba(93, 169, 255, .15);
      --green: #41d693;
      --green-deep: #117653;
      --red: #ff6b70;
      --red-soft: rgba(255, 107, 112, .13);
      --amber: #ffca68;
      --header-height: 10.7rem;
      --table-head-height: 5.1rem;
      --row-height: 4.65rem;
      --problem-size: 5.35rem;
      --rank-size: 5.5rem;
      --solved-size: 7.1rem;
      --penalty-size: 8.3rem;
      --team-size: 25rem;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: geometricPrecision;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-width: 900px;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: -1;
      content: "";
      pointer-events: none;
      background:
        radial-gradient(circle at 14% -10%, rgba(54, 119, 202, .17), transparent 32rem),
        linear-gradient(115deg, rgba(255,255,255,.018) 1px, transparent 1px);
      background-size: auto, 3.5rem 3.5rem;
    }

    button, input { font: inherit; }

    button {
      border: 0;
      color: inherit;
      cursor: pointer;
    }

    button:focus-visible, input:focus-visible {
      outline: 3px solid var(--blue);
      outline-offset: 3px;
    }

    .app {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: var(--header-height) minmax(0, 1fr) 2.5rem;
      height: 100vh;
      min-height: 600px;
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(24rem, 1fr) auto auto;
      align-items: center;
      gap: 2.5rem;
      padding: 1.6rem 2.3rem 1.35rem;
      border-bottom: 1px solid var(--line);
      background: rgba(7, 13, 24, .86);
      backdrop-filter: blur(20px);
    }

    .brand {
      display: grid;
      grid-template-columns: 4.35rem minmax(0, 1fr);
      align-items: center;
      gap: 1.25rem;
      min-width: 0;
    }

    .mark {
      position: relative;
      display: grid;
      width: 4.35rem;
      height: 4.35rem;
      place-items: center;
      overflow: hidden;
      border: 1px solid rgba(93, 169, 255, .32);
      border-radius: 1.15rem;
      background: var(--blue-soft);
      box-shadow: 0 0 2.8rem rgba(28, 123, 238, .14);
    }

    .mark svg { width: 2.7rem; height: 2.7rem; }

    .eyebrow {
      margin-bottom: .35rem;
      color: var(--blue);
      font-size: .88rem;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 100%;
      margin: 0;
      overflow: hidden;
      color: white;
      font-size: clamp(1.55rem, 2.05vw, 2.55rem);
      font-weight: 790;
      letter-spacing: -.04em;
      line-height: 1.06;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .contest-meta {
      display: flex;
      align-items: center;
      gap: .72rem;
      margin-top: .55rem;
      color: var(--muted);
      font-size: .92rem;
      font-weight: 650;
    }

    .dot { color: #53647b; }

    .phase-pill {
      display: inline-flex;
      align-items: center;
      gap: .48rem;
      padding: .44rem .76rem;
      border: 1px solid rgba(65, 214, 147, .23);
      border-radius: 999px;
      color: #74e6b2;
      background: rgba(65, 214, 147, .09);
      font-size: .83rem;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .phase-pill::before {
      width: .5rem;
      height: .5rem;
      border-radius: 50%;
      background: currentColor;
      content: "";
      box-shadow: 0 0 0 .3rem rgba(65, 214, 147, .11);
    }

    .phase-pill.finished {
      border-color: rgba(143, 161, 185, .23);
      color: #b4c0cf;
      background: rgba(143, 161, 185, .09);
    }

    .phase-pill.pending {
      border-color: rgba(255, 202, 104, .23);
      color: var(--amber);
      background: rgba(255, 202, 104, .09);
    }

    .timer-block {
      width: clamp(13rem, 16vw, 18rem);
      text-align: center;
    }

    .timer-label {
      margin-bottom: .3rem;
      color: var(--muted);
      font-size: .77rem;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .timer {
      color: white;
      font-variant-numeric: tabular-nums;
      font-size: clamp(2.9rem, 4vw, 4.6rem);
      font-weight: 760;
      letter-spacing: -.045em;
      line-height: 1;
    }

    .right-status {
      display: flex;
      align-items: center;
      gap: 1.1rem;
    }

    .icon-button {
      display: grid;
      width: 3.15rem;
      height: 3.15rem;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: .88rem;
      background: var(--surface);
      transition: border-color .18s ease, background .18s ease, transform .18s ease;
    }

    .icon-button:hover {
      border-color: rgba(93, 169, 255, .48);
      background: var(--surface-raised);
      transform: translateY(-1px);
    }

    .icon-button svg { width: 1.35rem; height: 1.35rem; }

    main {
      min-width: 0;
      min-height: 0;
      padding: 1rem 1.5rem .55rem;
    }

    .scoreboard {
      height: 100%;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 1.1rem;
      background: rgba(12, 22, 37, .86);
      box-shadow: 0 1.5rem 4rem rgba(0, 0, 0, .23);
    }

    .score-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      table-layout: fixed;
    }

    th, td {
      overflow: hidden;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    th:last-child, td:last-child { border-right: 0; }

    thead th {
      height: var(--table-head-height);
      padding: .65rem .35rem;
      color: #91a3ba;
      background: #101c2e;
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .095em;
      text-transform: uppercase;
    }

    thead th:first-child { border-radius: 1rem 0 0; }
    thead th:last-child { border-radius: 0 1rem 0 0; }

    .rank-col { width: var(--rank-size); }
    th.rank-col, td.rank-col { text-overflow: clip; }
    .team-col { width: var(--team-size); min-width: 0; text-align: left; }
    .solved-col { width: var(--solved-size); }
    .penalty-col { width: var(--penalty-size); }
    .problem-col { width: var(--problem-size); }

    .th-primary {
      display: block;
      margin-bottom: .18rem;
      color: #eef4fb;
      font-size: 1.25rem;
      letter-spacing: 0;
    }

    .th-sub {
      color: #71849c;
      font-size: .65rem;
      letter-spacing: .07em;
    }

    th.problem-col .th-primary { margin-bottom: 0; }

    tbody tr {
      height: var(--row-height);
      background: rgba(255, 255, 255, .009);
    }

    tbody tr:nth-child(even) { background: rgba(255, 255, 255, .028); }

    tbody tr.ghost-row td > * { opacity: .72; }

    tbody tr.score-group-start td {
      border-top: 4px solid rgba(184, 206, 235, .42);
    }

    tbody tr.recent-solve,
    tbody tr.recent-solve:nth-child(even) {
      background: linear-gradient(90deg, rgba(65, 214, 147, .13), rgba(65, 214, 147, .025) 38%, transparent 70%);
    }

    tbody tr.recent-solve .team-cell { box-shadow: inset .24rem 0 0 var(--green); }

    tbody tr.is-new {
      animation: reveal .55s cubic-bezier(.2,.75,.25,1) both;
      animation-delay: calc(var(--row-index) * 35ms);
    }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(.45rem); }
      to { opacity: 1; transform: none; }
    }

    tbody td { height: var(--row-height); padding: .4rem .45rem; }

    .rank-number {
      color: #c8d3e1;
      font-variant-numeric: tabular-nums;
      font-size: 1.55rem;
      font-weight: 790;
      letter-spacing: -.04em;
    }

    .medal {
      display: inline-grid;
      width: 2.8rem;
      height: 2.8rem;
      place-items: center;
      border: 1px solid rgba(255, 202, 104, .36);
      border-radius: .82rem;
      color: #17120a;
      background: linear-gradient(145deg, #ffe49a, #e8a833);
      font-size: 1.3rem;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.55), 0 .35rem 1rem rgba(226,160,35,.1);
    }

    .medal.silver {
      border-color: rgba(213, 224, 237, .35);
      color: #18202a;
      background: linear-gradient(145deg, #f2f6fa, #9aaabd);
    }

    .medal.bronze {
      border-color: rgba(214, 145, 102, .35);
      color: #21130d;
      background: linear-gradient(145deg, #e8ac84, #a45a31);
    }

    .team-cell { padding-left: 1.25rem; text-align: left; }

    .team-heading {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: .65rem;
    }

    .team-name {
      min-width: 0;
      overflow: hidden;
      color: #f7f9fc;
      font-size: clamp(1.18rem, 1.47vw, 1.75rem);
      font-weight: 735;
      letter-spacing: -.025em;
      line-height: 1.12;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .ghost-marker {
      flex: 0 0 1.5rem;
      width: 1.5rem;
      line-height: 1;
      font-size: 1.25rem;
      text-align: center;
    }

    .recent-solve-badge {
      flex: none;
      padding: .24rem .46rem;
      border: 1px solid rgba(65, 214, 147, .34);
      border-radius: 999px;
      color: #baffdc;
      background: rgba(65, 214, 147, .12);
      font-size: .6rem;
      font-weight: 850;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .team-members {
      margin-top: .26rem;
      overflow: hidden;
      color: #8193aa;
      font-size: clamp(.66rem, .68vw, .82rem);
      font-weight: 600;
      line-height: 1.12;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .score-main {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #f7fafc;
      font-variant-numeric: tabular-nums;
      font-size: 1.88rem;
      font-weight: 800;
      letter-spacing: -.045em;
    }

    .penalty-main {
      color: #b7c4d4;
      font-variant-numeric: tabular-nums;
      font-size: 1.38rem;
      font-weight: 720;
      letter-spacing: -.025em;
    }

    .problem-cell {
      position: relative;
      padding: .4rem .25rem;
      font-variant-numeric: tabular-nums;
    }

    .problem-result {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      width: 100%;
      min-height: min(3.55rem, calc(var(--row-height) - .8rem));
      place-content: center;
      border: 1px solid transparent;
      border-radius: .72rem;
      line-height: 1;
    }

    .problem-result.solved {
      border-color: rgba(65, 214, 147, .27);
      color: #d9ffef;
      background: linear-gradient(145deg, rgba(25, 154, 104, .72), rgba(17, 118, 83, .78));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.09);
    }

    .problem-result.partial {
      border-color: #b39342;
      color: #ffedbb;
      background: #584722;
    }

    .problem-result.preliminary { border-style: dashed; }
    .problem-score.long-score { font-size: .85rem; }
    .score-main.long-score { font-size: 1.1rem; }
    .problem-score { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
    .problem-cell.recent-solve-cell .problem-result.partial {
      border-color: #ffe7a2;
      box-shadow: 0 0 0 2px rgba(255, 216, 112, .3);
    }

    .problem-result.first-to-solve {
      border-color: rgba(255, 226, 124, .5);
      color: #fff6c8;
      background: linear-gradient(145deg, rgba(68, 176, 113, .92), rgba(139, 133, 37, .9));
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .18),
        0 0 1rem rgba(255, 226, 124, .13);
    }

    .problem-cell.recent-solve-cell .problem-result.solved {
      border-color: #a8ffda;
      background: linear-gradient(145deg, rgba(42, 190, 132, .95), rgba(20, 139, 95, .96));
      box-shadow:
        0 0 0 2px rgba(65, 214, 147, .3),
        0 0 1.15rem rgba(65, 214, 147, .27),
        inset 0 1px 0 rgba(255, 255, 255, .2);
    }

    .problem-result.failed {
      border-color: rgba(255, 107, 112, .18);
      color: #ff8e92;
      background: var(--red-soft);
    }

    .problem-result.frozen {
      border-color: rgba(126, 143, 218, .34);
      color: #8092ff;
      background: linear-gradient(145deg, rgba(49, 59, 118, .62), rgba(32, 40, 86, .72));
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .07),
        0 0 0 1px rgba(126, 143, 218, .06);
    }

    .problem-result.empty { color: #4e6076; }

    .problem-score {
      font-size: 1.05rem;
      font-weight: 820;
    }

    .problem-time {
      margin-top: .28rem;
      font-size: .68rem;
      font-weight: 710;
      opacity: .78;
    }

    .scoreboard.compact-problems .problem-cell { padding-inline: .18rem; }
    .scoreboard.compact-problems .problem-result { border-radius: .58rem; }
    .scoreboard.compact-problems .problem-time { font-size: .61rem; }

    .scoreboard.compact-rows tbody td { padding-block: .25rem; }
    .scoreboard.compact-rows .team-name {
      font-size: clamp(1.05rem, 1.25vw, 1.4rem);
      line-height: 1.02;
    }
    .scoreboard.compact-rows .team-members {
      display: block;
      margin-top: .08rem;
      font-size: .62rem;
      line-height: 1;
    }
    .scoreboard.compact-rows .recent-solve-badge {
      padding: .18rem .36rem;
      font-size: .53rem;
    }
    .scoreboard.compact-rows .medal {
      width: 2.4rem;
      height: 2.4rem;
      border-radius: .68rem;
    }
    .scoreboard.compact-rows .problem-cell { padding-block: .2rem; }
    .scoreboard.compact-rows .problem-result {
      min-height: calc(var(--row-height) - .4rem);
    }

    .empty-state {
      display: none;
      height: calc(100% - var(--table-head-height));
      place-items: center;
      color: var(--muted);
      font-size: 1.35rem;
      font-weight: 680;
    }

    .empty-state.visible { display: grid; }

    .footer {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 1.9rem;
      color: #708198;
      font-size: .76rem;
      font-weight: 690;
      letter-spacing: .045em;
    }

    .sync-status { display: flex; align-items: center; gap: .55rem; }

    .sync-dot {
      width: .48rem;
      height: .48rem;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 .24rem rgba(65, 214, 147, .1);
    }

    .sync-status.loading .sync-dot {
      animation: pulse 1s ease-in-out infinite;
      background: var(--blue);
      box-shadow: 0 0 0 .24rem rgba(93, 169, 255, .1);
    }

    .sync-status.error .sync-dot {
      background: var(--red);
      box-shadow: 0 0 0 .24rem rgba(255, 107, 112, .1);
    }

    @keyframes pulse { 50% { opacity: .35; transform: scale(.74); } }

    .page-dots { display: flex; align-items: center; gap: .42rem; }

    .page-dot {
      width: .38rem;
      height: .38rem;
      border-radius: 99px;
      background: #435269;
      transition: width .2s ease, background .2s ease;
    }

    .page-dot.active { width: 1.35rem; background: var(--blue); }

    .page-label {
      color: #aebdd0;
      font-size: .72rem;
      font-weight: 780;
      letter-spacing: .065em;
      text-transform: uppercase;
    }

    .provider { justify-self: end; }

    dialog {
      width: min(35rem, calc(100vw - 3rem));
      max-height: calc(100vh - 2rem);
      padding: 0;
      overflow: auto;
      border: 1px solid rgba(173, 200, 235, .2);
      border-radius: .5rem;
      color: var(--text);
      background: #101b2b;
      box-shadow: 0 2rem 7rem rgba(0, 0, 0, .55);
    }

    dialog::backdrop {
      background: rgba(2, 6, 13, .76);
      backdrop-filter: blur(9px);
    }

    .dialog-content { padding: 2rem; }

    .dialog-kicker {
      color: var(--blue);
      font-size: .76rem;
      font-weight: 820;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    dialog h2 {
      margin: .55rem 0 .7rem;
      color: white;
      font-size: 1.5rem;
      letter-spacing: 0;
    }

    dialog p { margin: 0 0 1.5rem; color: #9eacc0; line-height: 1.55; }

    label {
      display: block;
      margin-bottom: .55rem;
      color: #c9d4e2;
      font-size: .85rem;
      font-weight: 740;
    }

    input, select, textarea {
      width: 100%;
      height: 3.65rem;
      padding: 0 1rem;
      border: 1px solid rgba(173, 200, 235, .18);
      border-radius: .4rem;
      color: white;
      background: #0a1422;
      font-size: 1.1rem;
    }

    .field-help { margin-top: .55rem; color: #6f8199; font-size: .75rem; }
    .setup-field { margin-top: 1rem; }
    .setup-field textarea { height: 9rem; padding: .75rem; font: .85rem monospace; resize: vertical; }
    .setup-field summary { cursor: pointer; color: #c9d4e2; font-weight: 700; margin-bottom: .7rem; }
    .checkbox-field { display: flex; align-items: center; gap: .65rem; margin: 1rem 0 0; }
    .checkbox-field input { flex: 0 0 1.1rem; width: 1.1rem; height: 1.1rem; padding: 0; accent-color: var(--blue); }
    [hidden] { display: none !important; }

    .dialog-actions { display: flex; gap: .8rem; margin-top: 1.65rem; }

    .primary-button, .secondary-button {
      height: 3.35rem;
      padding: 0 1.3rem;
      border-radius: .8rem;
      font-weight: 780;
    }

    .primary-button { flex: 1; color: #06101d; background: var(--blue); }
    .secondary-button { border: 1px solid var(--line); background: #162235; }

    .dialog-error { min-height: 1.2rem; margin-top: .75rem; color: #ff9498; font-size: .82rem; }

    .demo-badge {
      display: none;
      padding: .22rem .5rem;
      border: 1px solid rgba(255, 202, 104, .25);
      border-radius: .35rem;
      color: var(--amber);
      background: rgba(255, 202, 104, .08);
      font-size: .66rem;
      font-weight: 850;
      letter-spacing: .09em;
      text-transform: uppercase;
    }

    .demo-badge.visible { display: inline-block; }

    @media (max-height: 980px) {
      :root {
        --header-height: 8.65rem;
        --table-head-height: 4.3rem;
        --row-height: 4.25rem;
      }
      .topbar { padding-top: 1rem; padding-bottom: .9rem; }
      .mark { width: 3.7rem; height: 3.7rem; }
      .brand { grid-template-columns: 3.7rem minmax(0, 1fr); }
      .team-members { margin-top: .18rem; }
      .problem-result { min-height: min(3.1rem, calc(var(--row-height) - .8rem)); }
    }

    @media (max-width: 1200px) {
      :root { --problem-size: 4.45rem; --penalty-size: 6.6rem; --solved-size: 5.8rem; }
      .topbar { gap: 1.3rem; }
      .team-members { font-size: .6rem; }
      .team-name { font-size: 1.18rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none">
            <path d="M12 34V20M24 34V12M36 34V25" stroke="#5DA9FF" stroke-width="5" stroke-linecap="round"/>
            <path d="M8 38H40" stroke="#DCEBFF" stroke-width="3" stroke-linecap="round" opacity=".8"/>
          </svg>
        </div>
        <div>
          <div id="scoreboardLabel" class="eyebrow">ICPC Live Scoreboard</div>
          <h1 id="contestName">Ready for your contest</h1>
          <div class="contest-meta">
            <span id="phasePill" class="phase-pill pending">Setup</span>
            <span id="contestIdMeta">Codeforces</span>
            <span class="dot">•</span>
            <span id="teamCount">0 teams</span>
            <span id="demoBadge" class="demo-badge">Preview</span>
          </div>
        </div>
      </div>

      <div class="timer-block">
        <div id="timerLabel" class="timer-label">Contest time</div>
        <div id="contestTimer" class="timer">00:00:00</div>
      </div>

      <div class="right-status">
        <button id="refreshButton" class="icon-button" type="button" title="Refresh now" aria-label="Refresh now">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 12a9 9 0 0 1 15.12-6.56L21 8"/>
            <path d="M21 3v5h-5"/>
            <path d="M21 12a9 9 0 0 1-15.12 6.56L3 16"/>
            <path d="M8 16H3v5"/>
          </svg>
        </button>
        <button id="settingsButton" class="icon-button" type="button" title="Change contest" aria-label="Change contest">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21a2 2 0 0 1-4 0v-.09A1.7 1.7 0 0 0 8.6 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3a2 2 0 0 1 0-4h.09A1.7 1.7 0 0 0 4.6 8.6a1.7 1.7 0 0 0-.34-1.88l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3a2 2 0 0 1 4 0v.09a1.7 1.7 0 0 0 1 1.51 1.7 1.7 0 0 0 1.88-.34l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9c.12.38.33.72.6 1 .3.27.68.41 1.1.4H21a2 2 0 0 1 0 4h-.09a1.7 1.7 0 0 0-1.51.6z"/></svg>
        </button>
        <button id="fullscreenButton" class="icon-button" type="button" title="Enter fullscreen" aria-label="Enter fullscreen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg>
        </button>
      </div>
    </header>

    <main>
      <section class="scoreboard" aria-label="Contest standings">
        <table class="score-table">
          <colgroup id="colgroup">
            <col class="rank-col"><col class="team-col"><col class="solved-col"><col class="penalty-col">
          </colgroup>
          <thead><tr id="tableHead"></tr></thead>
          <tbody id="standingsBody"></tbody>
        </table>
        <div id="emptyState" class="empty-state">No participants are visible yet.</div>
      </section>
    </main>

    <footer class="footer">
      <div id="syncStatus" class="sync-status">
        <span class="sync-dot"></span><span id="syncText">Waiting for contest</span>
      </div>
      <div id="pageDots" class="page-dots" aria-label="Scoreboard page"></div>
      <div class="provider">Data from Codeforces · refreshes every <span id="refreshSeconds">30</span>s</div>
    </footer>
  </div>

  <dialog id="setupDialog">
    <form id="setupForm" class="dialog-content" method="dialog">
      <div class="dialog-kicker">Display setup</div>
      <h2>Scoreboard settings</h2>
      <div class="setup-field">
        <label for="sourceSelect">Data source</label>
        <select id="sourceSelect">
          <option value="codeforces">Codeforces</option>
          <option value="opentrains">OpenTrains</option>
          <option value="domjudge">DOMjudge</option>
        </select>
      </div>
      <div class="setup-field">
        <label for="contestInput">Scoreboard URL</label>
        <input id="contestInput" type="text" inputmode="url" autocomplete="off" placeholder="https://codeforces.com/group/.../contest/..." required>
      </div>
      <div id="codeforcesOptions" class="setup-field" hidden>
        <label for="groupInput">Group code (optional)</label>
        <input id="groupInput" type="text" autocomplete="off" spellcheck="false">
        <div class="field-help">Access account: <a href="https://codeforces.com/profile/pashka-bot" target="_blank" rel="noreferrer">pashka-bot</a></div>
        <label class="checkbox-field"><input id="ghostsInput" type="checkbox">Show original contest ghosts</label>
        <div class="setup-field">
          <label for="ioiMaximumInput">IOI default maximum points per task</label>
          <input id="ioiMaximumInput" type="number" min="0.00000001" step="any" value="100" required>
        </div>
      </div>
      <details class="setup-field">
        <summary>University names</summary>
        <label for="aliasesInput">Full name to short name (JSON)</label>
        <textarea id="aliasesInput" spellcheck="false" placeholder='{"Delft University of Technology": "TU Delft"}'></textarea>
      </details>
      <div id="dialogError" class="dialog-error" role="alert"></div>
      <div class="dialog-actions">
        <button id="previewButton" class="secondary-button" type="button">View preview</button>
        <button class="primary-button" type="submit">Show scoreboard</button>
      </div>
    </form>
  </dialog>

  <script id="serverConfig" type="application/json">null</script>
  <script src="/static/scoring.js?v=ioi-1"></script>
  <script src="/static/scoreboard.js?v=ioi-1"></script>
</body>
</html>
