services:
  - type: web
    name: codeforces-icpc-scoreboard
    runtime: python
    plan: free
    buildCommand: python3 -m unittest discover -s tests -v
    startCommand: python3 server.py
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: SCOREBOARD_SOURCE
        value: codeforces
      - key: CODEFORCES_STANDINGS_URL
        sync: false
