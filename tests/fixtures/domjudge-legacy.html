<!doctype html>
<!-- Reduced DOMjudge 7.3.3 markup from https://bastion.cs.fsu.edu/public.
     Synthetic results include a pending cell without a judged-count prefix. -->
<title>Scoreboard - DOMjudge</title>
<div class="card-header"><span style="font-weight: bold;">Legacy contest</span><span>contest over</span></div>
<table class="scoreboard center">
  <colgroup><col id="scorerank"/><col id="scoreteamname"/></colgroup>
  <thead><tr class="scoreheader">
    <th title="rank">rank</th><th title="team name">team</th><th colspan="2">score</th>
    <th title="problem Boolean switch search"><a>boolfind<div class="circle"></div></a></th>
    <th title="problem Float special compare test"><a>fltcmp<div class="circle"></div></a></th>
    <th title="problem Hello world"><a>hello<div class="circle"></div></a></th>
  </tr></thead>
  <tbody>
    <tr id="team:2">
      <td class="scorepl">1</td>
      <td class="scoretn" title="Example teamname"><a><span class="forceWidth">Example teamname</span><span class="univ forceWidth">Utrecht University</span></a></td>
      <td class="scorenc">1</td><td class="scorett">110</td>
      <td class="score_cell"><div class="score_correct score_first">90<br/><span>2 tries</span></div></td>
      <td class="score_cell"><div class="score_pending">&nbsp;<span>3 tries</span></div></td>
      <td class="score_cell"></td>
    </tr>
    <tr><td id="scoresummary">Summary</td><td class="scorenc">1</td></tr>
  </tbody>
</table>
<table id="cell_legend" class="scoreboard"><tr class="score_pending"><td>Tried, pending</td></tr></table>
