services:
  - type: web
    name: icpc-scoreboard
    runtime: python
    plan: free
    buildCommand: python3 -m unittest discover -s tests -v
    startCommand: python3 server.py
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
